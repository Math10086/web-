server:
  port: 8080

spring:
  application:
    name: xuelvquan-travel
  # ===== MySQL 5.1（本地课程库环境，root/root）=====
  datasource:
    url: jdbc:mysql://localhost:3306/xlvq?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false
    driver-class-name: com.mysql.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # 社区老版本方言：MySQL 5.1 不支持 Hibernate 6 默认的 datetime(6)/float(53)；
        # 子类把建表引擎改为 InnoDB（LegacyDialect 默认 MyISAM，不支持事务）
        dialect: com.xuelvquan.travel.common.MySQL51InnoDBDialect

# ===== 自定义 JWT 配置（过期时间 7 天）=====
jwt:
  secret: xuelvquan-travel-platform-secret-key-2026-very-long
  expiration: 604800000

xlvq:
  # ===== B6 学号格式校验（认证自动通过，无需人工审核）=====
  # 各校学号位数不同，改这里即可调整，不用改代码。
  verify:
    student-no-patterns:
      CSU: '^\d{8}$'      # 中南大学：8 位数字
      HUNNU: '^\d{10}$'   # 湖南师范大学：10 位数字
      HNU: '^\d{8}$'      # 湖南大学：8 位数字
    student-no-hints:
      CSU: 中南大学学号应为 8 位数字
      HUNNU: 湖南师范大学学号应为 10 位数字
      HNU: 湖南大学学号应为 8 位数字

  # ===== B9 匿名聚合洞察看板（对外公开）=====
  # 脱敏硬门槛：任何聚合单元样本量不足 min-sample 一律不输出（前端显示「样本不足，暂不展示」）。
  # 这是写进代码的硬规则，不提供绕过开关；调大只会更保守。
  insight:
    min-sample: 30

  # ===== 腾讯位置服务 WebServiceAPI key（地点搜索定位 / 路线规划共用）=====
  # 想换成自己的 key：申请 https://lbs.qq.com/dev/console/key/manage 后改这里，
  # 或设置环境变量 XLVQ_TMAP_KEY（优先级更高）。key 当日配额用光时地点搜索自动降级为景点库兜底。
  tmap-key: ${XLVQ_TMAP_KEY:BXNBZ-IUGOT-EAEXY-L22DC-BXEZE-Y6F7J}
  # ===== 公开信息采集配置（需求文档 3.19）=====
  crawl:
    # 是否开启定时采集
    enabled: true
    # 采集频率：默认每天 03:30 执行一次全量采集（Spring cron：秒 分 时 日 月 周）
    cron: 0 30 3 * * ?
    # 启动时是否执行一次采集（用于首次部署灌数据与验证采集链路）
    startup: true

  # ===== 大模型配置（AI 行程助手 · 「一句话规划」的意图解析）=====
  # 说明：这里只放后端，前端永远拿不到 api-key。
  # 未填 api-key 时功能自动降级为「本地关键词规则解析」，页面照常可用，不会报错。
  #
  # ── 怎么拿到一个（免费）key ─────────────────────────────
  # 默认接 智谱开放平台 GLM-4-Flash：永久免费、不限调用量、中文强、OpenAI 兼容。
  #   1. 打开 https://open.bigmodel.cn 注册（新用户送 2000 万 Token）
  #   2. 个人中心 → API Keys → 新建，复制形如 xxxxxx.yyyyyy 的 key
  #   3. 填到下面 api-key，或设置同名环境变量 XLvq_AI_API_KEY，重启后端即生效
  #
  # ── 想换别家？（都是 OpenAI 兼容，只改 base-url 与 model 两行）──────
  #   硅基流动   base-url: https://api.siliconflow.cn/v1        model: Qwen/Qwen2.5-7B-Instruct（永久免费）
  #   DeepSeek   base-url: https://api.deepseek.com/v1          model: deepseek-chat
  #   通义千问   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1  model: qwen-plus
  # ─────────────────────────────────────────────────
  ai:
    # 总开关：false 则完全不调大模型，直接走本地规则
    enabled: true
    base-url: https://open.bigmodel.cn/api/paas/v4
    # 留空 = 未配置 = 自动降级到本地规则（想启用就把 key 填在这里）
    api-key: ${XLvq_AI_API_KEY:}
    model: glm-4-flash
    # 单次调用超时（秒）；超时即降级，不会卡住页面
    timeout-seconds: 12

    # ===== 个性化 AI 聊天（AI 旅行搭子）=====
    # 引擎降级链：本地 Ollama → 云端（上面的 base-url + api-key）→ 离线话术
    # Ollama 走 OpenAI 兼容端点 /v1/chat/completions，与云端共用同一条调用代码
    ollama:
      enabled: true
      base-url: http://127.0.0.1:11434
      # 本地跑的模型（ollama pull 后填这里）；云端兜底复用上面的 model/base-url
      model: qwen2.5:7b
      # 首次对话要把模型加载进内存，给宽一点
      timeout-seconds: 90
    # 云端兜底的单次超时（聊天比意图解析要的生成更长，单独给一档）
    chat-timeout-seconds: 30
